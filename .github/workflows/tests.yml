name: Reproduce and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regenerate synthetic data and experiment
        run: |
          python generate_data.py
          python invoicelens.py
      - name: Run safety and reproducibility checks
        run: python -m unittest -v
      - name: Check committed outputs are reproducible
        run: git diff --exit-code -- data model.json results.json results.csv index.html
